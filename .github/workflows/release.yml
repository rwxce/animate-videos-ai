name: Release

# Squashes dev onto main as `release: vX.Y.Z`, tags it and back-merges into dev (scripts/release.mjs).
# main is what plugin users install. No plugin change since the last tag → no release.

on:
  schedule:
    - cron: '17 6 * * 1' # Mondays 06:17 UTC
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump'
        type: choice
        options: [patch, minor, major]
        default: patch
      dry_run:
        description: 'Print the plan without releasing'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: dev
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - run: node --test scripts/*.test.mjs

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          OWNER_ID: ${{ github.repository_owner_id }}
          BUMP: ${{ inputs.bump || 'patch' }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          # Every commit the release makes (version bump, release on main, back-merge) is the owner's.
          git config user.name "$OWNER"
          git config user.email "${OWNER_ID}+${OWNER}@users.noreply.github.com"
          args=(--bump "$BUMP")
          [ "$DRY_RUN" = "true" ] && args+=(--dry-run)
          node scripts/release.mjs "${args[@]}"
